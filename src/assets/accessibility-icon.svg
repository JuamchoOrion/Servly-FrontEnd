  <!-- Brazo izquierdo -->
  <line x1="256" y1="220" x2="160" y2="140" stroke="white" stroke-width="30" stroke-linecap="round"/>

  <!-- Brazo derecho -->
  <line x1="256" y1="220" x2="352" y2="140" stroke="white" stroke-width="30" stroke-linecap="round"/>

  <!-- Pierna izquierda -->
  <line x1="256" y1="310" x2="180" y2="400" stroke="white" stroke-width="30" stroke-linecap="round"/>

  <!-- Pierna derecha -->
  <line x1="256" y1="310" x2="332" y2="400" stroke="white" stroke-width="30" stroke-linecap="round"/>
</svg>

