<!-- Contenedor principal de accesibilidad GLOBAL -->
<div class="accessibility-container">
  <!-- Botón flotante de accesibilidad -->
  <button
    class="accessibility-toggle"
    (click)="toggleMenu()"
    aria-label="Abrir menú de accesibilidad"
    title="Configuración de Accesibilidad"
    [attr.aria-expanded]="isOpen"
    aria-controls="accessibility-panel"
  >
    <svg class="toggle-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Círculo fondo azul -->
      <circle cx="256" cy="256" r="256" fill="#0078D4"/>
      <!-- Cabeza (círculo blanco) -->
      <circle cx="256" cy="140" r="50" fill="white"/>
      <!-- Cuerpo (línea vertical blanca) -->
      <line x1="256" y1="190" x2="256" y2="310" stroke="white" stroke-width="30" stroke-linecap="round"/>
      <!-- Brazo izquierdo -->
      <line x1="256" y1="220" x2="160" y2="140" stroke="white" stroke-width="30" stroke-linecap="round"/>
      <!-- Brazo derecho -->
      <line x1="256" y1="220" x2="352" y2="140" stroke="white" stroke-width="30" stroke-linecap="round"/>
      <!-- Pierna izquierda -->
      <line x1="256" y1="310" x2="180" y2="400" stroke="white" stroke-width="30" stroke-linecap="round"/>
      <!-- Pierna derecha -->
      <line x1="256" y1="310" x2="332" y2="400" stroke="white" stroke-width="30" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Panel desplegable de accesibilidad -->
  <div
    *ngIf="isOpen"
    class="accessibility-menu"
    role="dialog"
    id="accessibility-panel"
    aria-label="Panel de configuración de accesibilidad"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="menu-header">
      <svg class="accessibility-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Círculo fondo azul -->
        <circle cx="256" cy="256" r="256" fill="#0078D4"/>
        <!-- Cabeza (círculo blanco) -->
        <circle cx="256" cy="140" r="50" fill="white"/>
        <!-- Cuerpo (línea vertical blanca) -->
        <line x1="256" y1="190" x2="256" y2="310" stroke="white" stroke-width="30" stroke-linecap="round"/>
        <!-- Brazo izquierdo -->
        <line x1="256" y1="220" x2="160" y2="140" stroke="white" stroke-width="30" stroke-linecap="round"/>
        <!-- Brazo derecho -->
        <line x1="256" y1="220" x2="352" y2="140" stroke="white" stroke-width="30" stroke-linecap="round"/>
        <!-- Pierna izquierda -->
        <line x1="256" y1="310" x2="180" y2="400" stroke="white" stroke-width="30" stroke-linecap="round"/>
        <!-- Pierna derecha -->
        <line x1="256" y1="310" x2="332" y2="400" stroke="white" stroke-width="30" stroke-linecap="round"/>
      </svg>
      <h2 class="menu-title">Accesibilidad</h2>
      <button
        (click)="closeMenu()"
        class="close-btn"
        aria-label="Cerrar menú"
        title="Cerrar (Esc)"
      >
        <span class="material-icons">close</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="menu-divider"></div>

    <!-- Contenido -->
    <div class="menu-content">

      <!-- Modo Oscuro -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="material-icons">dark_mode</span>
          <label for="dark-mode" class="setting-label">Modo Oscuro</label>
        </div>
        <label class="toggle-switch">
          <input
            id="dark-mode"
            type="checkbox"
            [checked]="settings.darkMode"
            (change)="toggleDarkMode()"
            aria-label="Activar o desactivar modo oscuro"
          />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Tamaño de Letra -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="material-icons">text_fields</span>
          <label for="font-size" class="setting-label">Tamaño de Letra</label>
        </div>
        <select
          id="font-size"
          [value]="settings.fontSize"
          (change)="updateFontSize($any($event).target.value)"
          class="font-select"
          aria-label="Seleccionar tamaño de letra"
        >
          <option *ngFor="let option of fontSizeOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>

      <!-- Alto Contraste -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="material-icons">contrast</span>
          <label for="high-contrast" class="setting-label">Alto Contraste</label>
        </div>
        <label class="toggle-switch">
          <input
            id="high-contrast"
            type="checkbox"
            [checked]="settings.highContrast"
            (change)="toggleHighContrast()"
            aria-label="Activar o desactivar alto contraste"
          />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Reducir Movimiento -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="material-icons">motion_photos_pause</span>
          <label for="reduce-motion" class="setting-label">Reducir Movimiento</label>
        </div>
        <label class="toggle-switch">
          <input
            id="reduce-motion"
            type="checkbox"
            [checked]="settings.reduceMotion"
            (change)="toggleReduceMotion()"
            aria-label="Activar o desactivar reducción de movimiento"
          />
          <span class="toggle-slider"></span>
        </label>
      </div>

    </div>

    <!-- Divider -->
    <div class="menu-divider"></div>

    <!-- Footer con botón reset -->
    <div class="menu-footer">
      <button class="reset-btn" (click)="resetSettings()" title="Restablecer configuración a valores por defecto">
        <span class="material-icons">refresh</span>
        Restablecer
      </button>
    </div>
  </div>
</div>
